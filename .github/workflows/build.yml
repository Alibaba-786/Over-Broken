name: Build Casino Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          libssl-dev \
          lld \
          ccache \
          libffi-dev

    - name: Install Correct Cython & Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" "buildozer>=1.5.0" sh

    - name: Build APK with Buildozer
      run: |
        # Acceptance of Android SDK Licenses automatically
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoyalCasino-USDT-APK
        path: bin/*.apk

